<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub - Secure Download Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b20710;
            --bg-dark: #0a0a0a;
            --bg-card: #111111;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .download-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }

        .status-container {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .spinner {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .status-text {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .status-subtext {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--primary);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s ease;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .btn-download:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-download:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover { color: var(--primary); }

        .secure-badge {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>

    <div class="download-box">
        <div class="logo">
            <i class="fas fa-film"></i> CineHub
        </div>
        
        <h2 class="movie-title" id="displayTitle">Loading Movie Details...</h2>
        
        <div class="status-container">
            <div id="statusIcon" class="spinner"><i class="fas fa-spinner"></i></div>
            <div id="statusText" class="status-text">Preparing your download link...</div>
            <div id="statusSubtext" class="status-subtext">Please wait while we verify your file.</div>
        </div>

        <button id="actionBtn" class="btn-download" disabled>
            <i class="fas fa-download"></i> Preparing Download...
        </button>

        <div class="secure-badge">
            <i class="fas fa-shield-alt"></i> Secure download link verified by CineHub.
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to CineHub</a>
    </div>

    <script src="movies-data.js"></script>
    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
        const BASE_URL = 'https://api.themoviedb.org/3';

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        const titleEl = document.getElementById('displayTitle');
        const iconEl = document.getElementById('statusIcon');
        const textEl = document.getElementById('statusText');
        const subtextEl = document.getElementById('statusSubtext');
        const actionBtn = document.getElementById('actionBtn');

        let targetDownloadUrl = "";

        if (movieId && window.downloadLinks && window.downloadLinks[movieId]) {
            targetDownloadUrl = window.downloadLinks[movieId];

            // Fetch real movie title from TMDB
            fetch(`${BASE_URL}/movie/${movieId}?api_key=${API_KEY}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.title) {
                        titleEl.textContent = data.title;
                    } else {
                        titleEl.textContent = "Your Requested Movie";
                    }
                })
                .catch(() => {
                    titleEl.textContent = "Your Requested Movie";
                });

            // Ready to download — no fake server ping needed
            iconEl.innerHTML = '<i class="fas fa-check-circle" style="color: #2ecc71;"></i>';
            iconEl.className = "";
            textEl.textContent = "Download Ready!";
            subtextEl.textContent = "Your file is ready. Click the button below to start your download.";

            actionBtn.disabled = false;
            actionBtn.innerHTML = '<i class="fas fa-download"></i> Start Download Now';

            actionBtn.onclick = () => {
                actionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Starting Download...';
                actionBtn.disabled = true;

                const triggerAnchor = document.createElement('a');
                triggerAnchor.href = targetDownloadUrl;
                triggerAnchor.setAttribute('download', '');
                triggerAnchor.target = '_blank';
                document.body.appendChild(triggerAnchor);
                triggerAnchor.click();
                document.body.removeChild(triggerAnchor);

                setTimeout(() => {
                    actionBtn.innerHTML = '<i class="fas fa-download"></i> Start Download Now';
                    actionBtn.disabled = false;
                }, 5000);
            };

        } else {
            // No valid movie ID found
            titleEl.textContent = "Error: Link Expired or Invalid";
            textEl.textContent = "No valid download link found.";
            subtextEl.textContent = "Please return to the homepage and select a valid movie.";
            iconEl.innerHTML = '<i class="fas fa-exclamation-triangle" style="color: #e50914;"></i>';
            iconEl.className = "";
            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i class="fas fa-ban"></i> No Download Available';
        }
    </script>
</body>
</html>
