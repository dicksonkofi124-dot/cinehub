<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub - Secure Download Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b20710;
            --bg-dark: #0a0a0a;
            --bg-card: #111111;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .download-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }

        .status-container {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .spinner {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .status-text {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .status-subtext {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--primary);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s ease;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .btn-download:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-download:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover { color: var(--primary); }

        .secure-badge {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>
    <div id="verifyOverlay" style="position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem;">
        <div style="text-align:center;max-width:420px;width:100%;">
            <div style="font-size:3.5rem;margin-bottom:1rem;">&#127916;</div>
            <h1 style="color:white;font-size:2rem;font-weight:900;margin-bottom:0.5rem;font-family:system-ui,sans-serif;">CineHub</h1>
            <p style="color:#aaa;font-size:1rem;margin-bottom:2.5rem;font-family:system-ui,sans-serif;">Your ultimate movie destination</p>

            <div style="background:#111;border:1px solid #333;border-radius:12px;padding:2rem;margin-bottom:1.5rem;">
                <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
                    <div id="verifyCheckbox" style="width:28px;height:28px;border:2px solid #555;border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;background:#1a1a1a;"></div>
                    <span id="verifyLabel" style="color:#e0e0e0;font-size:1rem;font-family:system-ui,sans-serif;cursor:pointer;">I am not a robot</span>
                </div>
                <div style="display:flex;align-items:center;justify-content:flex-end;gap:0.5rem;">
                    <span style="color:#555;font-size:0.7rem;font-family:system-ui,sans-serif;">Privacy - Terms</span>
                </div>
            </div>

            <button id="verifyBtn" disabled style="width:100%;padding:1rem;background:#333;color:#777;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:not-allowed;font-family:system-ui,sans-serif;transition:all 0.3s;">
                Verify to Continue
            </button>
        </div>
        <p style="color:#444;font-size:0.75rem;font-family:system-ui,sans-serif;">Protected by CineHub Security &middot; &copy; 2026</p>
    </div>
    <style>#verifyOverlay * { box-sizing: border-box; }</style>


    <div class="download-box">
        <div class="logo">
            <i class="fas fa-film"></i> CineHub
        </div>
        
        <h2 class="movie-title" id="displayTitle">Loading Movie Details...</h2>
        
        <div class="status-container">
            <div id="statusIcon" class="spinner"><i class="fas fa-spinner"></i></div>
            <div id="statusText" class="status-text">Preparing your download link...</div>
            <div id="statusSubtext" class="status-subtext">Please wait while we verify your file.</div>
        </div>

        <button id="actionBtn" class="btn-download" disabled>
            <i class="fas fa-download"></i> Preparing Download...
        </button>

        <div class="secure-badge">
            <i class="fas fa-shield-alt"></i> Secure download link verified by CineHub.
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to CineHub</a>
    </div>

    <script src="movies-data.js"></script>
    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
        const BASE_URL = 'https://api.themoviedb.org/3';

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        const titleEl = document.getElementById('displayTitle');
        const iconEl = document.getElementById('statusIcon');
        const textEl = document.getElementById('statusText');
        const subtextEl = document.getElementById('statusSubtext');
        const actionBtn = document.getElementById('actionBtn');

        let targetDownloadUrl = "";

        // Try both string and number keys since JS objects can differ
        const dlKey = window.downloadLinks && (window.downloadLinks[movieId] || window.downloadLinks[parseInt(movieId)]);

        if (movieId && dlKey) {
            targetDownloadUrl = dlKey;

            // Fetch real movie title from TMDB
            fetch(`${BASE_URL}/movie/${movieId}?api_key=${API_KEY}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.title) {
                        titleEl.textContent = data.title;
                    } else {
                        titleEl.textContent = "Your Requested Movie";
                    }
                })
                .catch(() => {
                    titleEl.textContent = "Your Requested Movie";
                });

            // Prepare the button, but keep it disabled until human verification passes.
            // (window.__cinehubVerified is set by the verification script below.)
            iconEl.innerHTML = '<i class="fas fa-check-circle" style="color: #2ecc71;"></i>';
            iconEl.className = "";
            textEl.textContent = "Download Ready!";
            subtextEl.textContent = "Please verify you're human above, then click below to start your download.";

            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i class="fas fa-lock"></i> Verify to Unlock Download';

            function unlockDownloadButton() {
                actionBtn.disabled = false;
                actionBtn.innerHTML = '<i class="fas fa-download"></i> Start Download Now';
            }

            // If verification already completed (script below ran first), unlock now.
            // Otherwise, listen for the custom event it dispatches on success.
            if (window.__cinehubVerified) {
                unlockDownloadButton();
            } else {
                window.addEventListener('cinehub:verified', unlockDownloadButton);
            }

            actionBtn.onclick = () => {
                if (actionBtn.disabled) return;
                actionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Starting Download...';
                actionBtn.disabled = true;

                const triggerAnchor = document.createElement('a');
                triggerAnchor.href = targetDownloadUrl;
                triggerAnchor.setAttribute('download', '');
                triggerAnchor.target = '_blank';
                document.body.appendChild(triggerAnchor);
                triggerAnchor.click();
                document.body.removeChild(triggerAnchor);

                setTimeout(() => {
                    actionBtn.innerHTML = '<i class="fas fa-download"></i> Start Download Now';
                    actionBtn.disabled = false;
                }, 5000);
            };

        } else {
            // No valid movie ID found
            titleEl.textContent = "Error: Link Expired or Invalid";
            textEl.textContent = "No valid download link found.";
            subtextEl.textContent = "Please return to the homepage and select a valid movie.";
            iconEl.innerHTML = '<i class="fas fa-exclamation-triangle" style="color: #e50914;"></i>';
            iconEl.className = "";
            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i class="fas fa-ban"></i> No Download Available';
        }
    </script>

    <script>
        (function() {
            var verified = false;

            function init() {
                var overlay = document.getElementById('verifyOverlay');
                if (!overlay) return;

                overlay.style.display = 'flex';
                overlay.style.opacity = '1';

                var box = document.getElementById('verifyCheckbox');
                var label = document.getElementById('verifyLabel');
                var btn = document.getElementById('verifyBtn');

                function handleVerify() {
                    if (verified) return;
                    verified = true;
                    box.style.background = '#e50914';
                    box.style.borderColor = '#e50914';
                    box.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                    btn.disabled = false;
                    btn.style.background = '#e50914';
                    btn.style.color = 'white';
                    btn.style.cursor = 'pointer';
                    btn.style.boxShadow = '0 4px 15px rgba(229,9,20,0.4)';
                }

                function submitVerify() {
                    if (!verified) return;
                    btn.innerHTML = '&#10003; Verified! Loading...';
                    btn.style.background = '#2ecc71';
                    btn.style.boxShadow = 'none';
                    window.__cinehubVerified = true;
                    window.dispatchEvent(new Event('cinehub:verified'));
                    setTimeout(function() {
                        overlay.style.transition = 'opacity 0.6s ease';
                        overlay.style.opacity = '0';
                        setTimeout(function() { overlay.style.display = 'none'; }, 600);
                    }, 500);
                }

                box.addEventListener('click', handleVerify);
                label.addEventListener('click', handleVerify);
                btn.addEventListener('click', submitVerify);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
