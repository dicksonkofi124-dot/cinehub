<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHub - Secure Download Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #b20710;
            --bg-dark: #0a0a0a;
            --bg-card: #111111;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .download-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }

        .status-container {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .spinner {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .status-text {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .status-subtext {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--primary);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s ease;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .btn-download:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-download:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover { color: var(--primary); }

        .secure-badge {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
    </style>
</head>
<body>
    <div id="verifyOverlay" style="position:fixed;inset:0;background:#0a0a0a;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem;">
        <div style="text-align:center;max-width:420px;width:100%;">
            <div style="font-size:3.5rem;margin-bottom:1rem;">&#127916;</div>
            <h1 style="color:white;font-size:2rem;font-weight:900;margin-bottom:0.5rem;font-family:system-ui,sans-serif;">CineHub</h1>
            <p style="color:#aaa;font-size:1rem;margin-bottom:2.5rem;font-family:system-ui,sans-serif;">Your ultimate movie destination</p>

            <div style="background:#111;border:1px solid #333;border-radius:12px;padding:2rem;margin-bottom:1.5rem;">
                <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
                    <div id="verifyCheckbox" style="width:28px;height:28px;border:2px solid #555;border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;"></div>
                    <span id="verifyLabel" style="color:#e0e0e0;font-size:1rem;font-family:system-ui,sans-serif;cursor:pointer;">I am not a robot</span>
                </div>
                <div style="display:flex;align-items:center;justify-content:flex-end;gap:0.5rem;">
                    <span style="color:#555;font-size:0.7rem;font-family:system-ui,sans-serif;">Privacy - Terms</span>
                </div>
            </div>

            <button id="verifyBtn" disabled style="width:100%;padding:1rem;background:#333;color:#777;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:not-allowed;font-family:system-ui,sans-serif;transition:0.2s;">
                Verify to Continue
            </button>
        </div>
        <p style="color:#444;font-size:0.75rem;font-family:system-ui,sans-serif;">Protected by CineHub Security &middot; &copy; 2026</p>
    </div>
    <style>#verifyOverlay * { box-sizing: border-box; }</style>


    <div class="download-box">
        <div class="logo">
            <i class="fas fa-film"></i> CineHub
        </div>
        
        <h2 class="movie-title" id="displayTitle">Loading Movie Details...</h2>
        
        <div class="status-container">
            <div id="statusIcon" class="spinner"><i class="fas fa-spinner"></i></div>
            <div id="statusText" class="status-text">Preparing your download link...</div>
            <div id="statusSubtext" class="status-subtext">Please wait while we verify your file.</div>
        </div>

        <button id="actionBtn" class="btn-download" disabled>
            <i class="fas fa-download"></i> Preparing Download...
        </button>

        <div class="secure-badge">
            <i class="fas fa-shield-alt"></i> Secure download link verified by CineHub.
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to CineHub</a>
    </div>

    <script src="config.js"></script>
    <script src="movies-data.js"></script>
    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const BRIDGE_API = window.CINEHUB_CONFIG?.bridgeApi || 'https://cinehub-bridge.onrender.com';

        const urlParams = new URLSearchParams(window.location.search);

        // Direct, already-resolved URL (used by TDrive Cloud's in-app "Download"
        // button) — no bridge call needed, the URL is ready to use as-is.
        const linkParam = urlParams.get('link');

        // Self-contained share-link format used by TDrive Cloud's "Copy Link".
        // msg = Telegram message ID, ch = TD channel ID (omitted for Saved Messages),
        // name = file name. Maps directly to the bridge's always-working stream
        // routes — no registry lookup, nothing to register, nothing to forget.
        const msgParam = urlParams.get('msg');
        const chParam = urlParams.get('ch');
        const nameParam = urlParams.get('name');

        // Legacy catalog format: TMDB movie ID, added via the admin panel.
        const messageId = urlParams.get('id');

        const titleEl = document.getElementById('displayTitle');
        const iconEl = document.getElementById('statusIcon');
        const textEl = document.getElementById('statusText');
        const subtextEl = document.getElementById('statusSubtext');
        const actionBtn = document.getElementById('actionBtn');

        let targetDownloadUrl = "";
        let fileName = "download";

        // Helper: Check if URL is cross-origin
        function isCrossOrigin(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.origin !== window.location.origin;
            } catch {
                return true; // Default to cross-origin if parsing fails
            }
        }

        // Helper: Trigger blob-based download (works in Chrome with proper CORS handling)
        function downloadViaBlob(url, filename) {
            console.log('Attempting blob download method:', url);
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    console.log('Response received, content-length:', response.headers.get('content-length'));
                    return response.blob();
                })
                .then(blob => {
                    console.log('Blob size:', blob.size, 'bytes');
                    
                    if (blob.size === 0) {
                        console.warn('Blob is empty, falling back to window.open');
                        window.open(url, '_blank');
                        return;
                    }
                    
                    const blobUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(blobUrl);
                    console.log('Blob download completed successfully');
                })
                .catch(error => {
                    console.error('Blob download failed:', error);
                    console.log('Falling back to window.open');
                    window.open(url, '_blank');
                });
        }

        // Fallback: Direct window.open for problematic URLs
        function downloadDirect(url, filename) {
            console.log('Using direct download method:', url);
            try {
                window.open(url, '_blank');
                console.log('Direct download triggered');
            } catch (error) {
                console.error('Direct download failed:', error);
                alert('Download failed. Please try again or check your browser settings.');
            }
        }

        // Helper: Trigger native download (direct link click)
        function downloadNative(url, filename) {
            console.log('Using native download method:', url);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            console.log('Native download triggered');
        }

        // Main download handler: Simplified approach for better reliability
        function triggerDownload(url, filename) {
            console.log('triggerDownload called with URL:', url, 'filename:', filename);
            
            if (!url) {
                console.error('No URL provided for download');
                alert('Download URL is missing. Please try again.');
                return;
            }
            
            // Try direct window.open first (most reliable for cross-origin)
            console.log('Attempting direct download via window.open');
            try {
                const newWindow = window.open(url, '_blank');
                if (newWindow) {
                    console.log('Download window opened successfully');
                } else {
                    console.warn('Popup blocked, trying fallback method');
                    // Fallback: create a link and click it
                    const link = document.createElement('a');
                    link.href = url;
                    link.target = '_blank';
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    console.log('Fallback download triggered');
                }
            } catch (error) {
                console.error('Download failed:', error);
                alert('Download failed. Please check your browser settings and try again.');
            }
        }

        // Shows the "ready to download" UI. Once verified, the button enables download
        function showDownloadReady(url, sourceInfo, downloadFileName) {
            targetDownloadUrl = url;
            fileName = downloadFileName || "download";

            iconEl.innerHTML = '<i class="fas fa-check-circle" style="color: #2ecc71;"></i>';
            iconEl.className = "";
            textEl.textContent = "Download Ready!";
            subtextEl.textContent = sourceInfo + " • Please verify you're human above, then click below to start your download.";

            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i class="fas fa-lock"></i> Verify to Unlock Download';

            function unlockDownloadButton() {
                // Replace button with clickable download trigger
                const downloadBtn = document.createElement('button');
                downloadBtn.id = 'actionBtn';
                downloadBtn.className = 'btn-download';
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Start Download Now';
                downloadBtn.style.cursor = 'pointer';
                downloadBtn.onclick = (e) => {
                    e.preventDefault();
                    console.log('Download button clicked, URL:', targetDownloadUrl, 'Filename:', fileName);
                    triggerDownload(targetDownloadUrl, fileName);
                };
                
                actionBtn.replaceWith(downloadBtn);
                console.log('Download button unlocked and ready');
            }

            // Set up the listener BEFORE checking if already verified
            window.addEventListener('cinehub:verified', unlockDownloadButton);
            
            // If already verified, call immediately
            if (window.__cinehubVerified) {
                console.log('Already verified, unlocking download button');
                unlockDownloadButton();
            }
        }

        function showNotFoundError() {
            titleEl.textContent = "Error: Link Expired or Invalid";
            textEl.textContent = "No valid download link found.";
            subtextEl.textContent = "Please return to the homepage and select a valid movie.";
            iconEl.innerHTML = '<i class="fas fa-exclamation-triangle" style="color: #e50914;"></i>';
            iconEl.className = "";
            actionBtn.disabled = true;
            actionBtn.innerHTML = '<i class="fas fa-ban"></i> No Download Available';
        }

        if (linkParam) {
            // ── Direct link (TDrive Cloud "Download" button) ──────────────────
            // Already a complete, ready-to-use URL — just show it as ready.
            titleEl.textContent = nameParam || "Your Requested File";
            showDownloadReady(linkParam, "Direct download from your device.", nameParam);

        } else if (msgParam) {
            // ── Direct share-link format (TDrive Cloud "Copy Link") ───────────
            // Built straight from the bridge's stream routes — always works,
            // nothing to register, nothing to keep in sync.
            titleEl.textContent = nameParam || "Your Requested File";

            const streamUrl = chParam
                ? `${BRIDGE_API}/download/${chParam}/${msgParam}`
                : `${BRIDGE_API}/download/home/${msgParam}`;
            const sourceInfo = chParam ? ("Source: TD Channel #" + chParam) : "Source: Saved Messages";

            showDownloadReady(streamUrl, sourceInfo, nameParam);

        } else if (messageId) {
            // ── Legacy catalog format: TMDB movie ID, mapped via the admin panel ──
            textEl.textContent = "Fetching download link from bridge server...";
            subtextEl.textContent = `Message ID: ${messageId}`;

            fetch(`${BRIDGE_API}/api/file/${messageId}`)
                .then(res => {
                    if (!res.ok) throw new Error('File not found on bridge server');
                    return res.json();
                })
                .then(data => {
                    if (data && data.downloadUrl) {
                        const sourceInfo = (data.channelId && data.channelId !== 0)
                            ? "Source: TD Channel #" + data.channelId
                            : "Source: Saved Messages";
                        titleEl.textContent = data.fileName || "Your Requested File";
                        showDownloadReady(data.downloadUrl, sourceInfo, data.fileName);
                    } else {
                        throw new Error('No download URL in response');
                    }
                })
                .catch(error => {
                    console.error('Bridge server error:', error);

                    // Fallback: catalog entries added via the admin panel (movies-data.js)
                    const dlEntry = window.downloadLinks && (window.downloadLinks[messageId] || window.downloadLinks[parseInt(messageId)]);
                    const dlKey = (dlEntry && typeof dlEntry === 'object') ? dlEntry.url : dlEntry;

                    if (dlKey) {
                        fetch(`${BASE_URL}/movie/${messageId}?api_key=${API_KEY}`)
                            .then(res => res.json())
                            .then(data => {
                                titleEl.textContent = (data && data.title) ? data.title : "Your Requested Movie";
                            })
                            .catch(() => {
                                titleEl.textContent = "Your Requested Movie";
                            });

                        showDownloadReady(dlKey, "Secure download link verified by CineHub.", "movie.mp4");
                    } else {
                        showNotFoundError();
                    }
                });
        } else {
            showNotFoundError();
        }
    </script>


    <script>
        (function() {
            var verified = false;

            function init() {
                var overlay = document.getElementById('verifyOverlay');
                if (!overlay) return;

                overlay.style.display = 'flex';
                overlay.style.opacity = '1';

                var box = document.getElementById('verifyCheckbox');
                var label = document.getElementById('verifyLabel');
                var btn = document.getElementById('verifyBtn');

                function handleVerify() {
                    if (verified) return;
                    verified = true;
                    box.style.background = '#e50914';
                    box.style.borderColor = '#e50914';
                    box.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                    btn.innerHTML = '&#10003; Verified! Loading...';
                    btn.style.background = '#2ecc71';
                    btn.style.boxShadow = 'none';
                    btn.style.color = 'white';
                    btn.style.cursor = 'default';
                    
                    window.__cinehubVerified = true;
                    window.dispatchEvent(new Event('cinehub:verified'));
                    console.log('User verified, triggering download unlock');
                    
                    setTimeout(function() {
                        overlay.style.transition = 'opacity 0.6s ease';
                        overlay.style.opacity = '0';
                        setTimeout(function() { overlay.style.display = 'none'; }, 600);
                    }, 500);
                }

                box.addEventListener('click', handleVerify);
                label.addEventListener('click', handleVerify);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
